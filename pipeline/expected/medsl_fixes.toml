# Recorded corrections to MEDSL precinct rows (step 4, Steve's option C). Applied visibly by
# pipeline.expected.medsl.apply_fixes; every run reports how many rows each fix touched.
# A fix needs an identified cause and must make its (state, year, office) pass the check (exactly, or on its
# named candidates where only write-ins differ: Steve, 2026-11-27); otherwise it is not made and the office
# stays failed, listed in docs/expected.md.
#
# Entry schema (all fields required):
# [[fix]]
# id = "<ST>-<year>-<n>"
# state = "NJ"
# year = 2022
# office = "US HOUSE"            # US SENATE | US HOUSE | GOVERNOR
# action = "drop"                # drop every row matching all of `match`; or "set": replace fields from [fix.set]
#                                # (writein only; never a vote count)
# change = "what it changes"
# evidence = "the official figure it restores, and the URL where it is published"
# before = "the differences before the fix"
# after = "the differences after the fix (none: exact match)"
# [fix.match]
# precinct = "COUNTY TOTAL"      # any normalized row field (see read_precincts); all must equal; a list
#                                # matches any of its items

[[fix]]
id = "NJ-2022-1"
state = "NJ"
year = 2022
office = "US HOUSE"
action = "drop"
change = "drop the county and district total lines MEDSL stores as precincts (every county but Mercer: '<County> Totals', 'District N Totals', Monmouth's 'District Totals' and 'Ocean Totals'); each equals the sum of its county's town rows"
evidence = "FEC Federal Elections 2022 (https://www.fec.gov/documents/5676/federalelections2022.xlsx, sha256 cdb258ea…): every district's candidates, e.g. NJ-01 Norcross 139,559"
before = "all 12 districts about 3x the FEC (NJ-01 Norcross 418,677 vs 139,559)"
after = "with NJ-2022-2: every NJ House contest equals the FEC exactly"
[fix.match]
precinct = [
    "Atlantic Totals",
    "Bergen Totals",
    "Burlington Totals",
    "Camden Totals",
    "Cape May Totals",
    "Cumberland Totals",
    "District 1 Totals",
    "District 10 Totals",
    "District 11 Totals",
    "District 12 Totals",
    "District 2 Totals",
    "District 3 Totals",
    "District 4 Totals",
    "District 5 Totals",
    "District 7 Totals",
    "District 8 Totals",
    "District 9 Totals",
    "District Totals",
    "Essex Totals",
    "Gloucester Totals",
    "Hudson Totals",
    "Hunterdon Totals",
    "Middlesex Totals",
    "Monmouth Totals",
    "Morris Totals",
    "Ocean Totals",
    "Passaic Totals",
    "Salem Totals",
    "Somerset Totals",
    "Sussex Totals",
    "Union Totals",
    "Warren Totals",
]

[[fix]]
id = "NJ-2022-2"
state = "NJ"
year = 2022
office = "US HOUSE"
action = "drop"
change = "Mercer: drop the town and 'Federal' rows, keep 'Mercer Totals'; the town rows lack votes the total has (NJ-03 Kim 31,845 by town vs 31,901 in the total)"
evidence = "FEC Federal Elections 2022 (https://www.fec.gov/documents/5676/federalelections2022.xlsx, sha256 cdb258ea…): NJ-03 Kim 150,498, Healey 118,415, Sobocinski 1,116"
before = "after NJ-2022-1 alone: NJ-03 Kim -56, Healey -7, Sobocinski -1"
