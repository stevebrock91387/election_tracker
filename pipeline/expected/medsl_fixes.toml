[[fix]]
id = "VT-2022-1"
state = "VT"
year = 2022
office = "US HOUSE"
action = "set"
change = "Ericka Redic (on the ballot, Libertarian) is flagged as a write-in on all 245 MEDSL rows: clear the flag"
evidence = "FEC Federal Elections 2022 (https://www.fec.gov/documents/5676/federalelections2022.xlsx, sha256 cdb258ea…): VT-00 Redic, Ericka, party LIB, 12,590 general votes"
before = "Redic's 12,590 counted with write-ins (MEDSL write-ins 13,561 vs FEC 1,004); named candidates fail"
after = "named candidates equal the FEC; write-ins still differ (passes on named candidates)"
[fix.match]
candidate = "ERICKA REDIC"
[fix.set]
writein = false

