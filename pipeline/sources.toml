# Enhanced Voting media exports, 2026 general election.
# Each URL is the "Media Export" (or, for AZ, "JSON") link on the state's official results page;
# see docs/enhanced-voting.md and sources/registry.csv for where each link was seen.
# min_interval_s: AZ's SOS allows one download per 2 minutes; the others publish no limit, so the same applies.

[ev-AZ-2026-general]
state = "AZ"
url = "https://app.enhancedvoting.com/cdn/results/Arizona/export-110326GeneralElection.json"
