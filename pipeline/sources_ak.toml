# Alaska Division of Elections results, 2026 general election. See
# docs/superpowers/specs/2026-11-24-step2-ak-reader-design.md and sources/registry.csv.
# A pass fetches the precinct-level CSV linked as "Summary (csv)" from
# https://www.elections.alaska.gov/election-results/e/?id=26genr: first-choice (round 1) results
# with five vote types per line. Ranked-choice rounds are a separate tabulation (not read).

[ak-2026-general]
state = "AK"
csv_url = "https://www.elections.alaska.gov/enr/26GENR/results/GA_ENR_Precinct_State_of_Alaska.csv"
min_interval_s = 120
