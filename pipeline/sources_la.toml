# Louisiana Secretary of State live election results (voterportal.sos.la.gov/graphical), 2026
# general election (11/03/2026). See docs/superpowers/specs/2026-11-24-step2-la-reader-design.md and
# sources/registry.csv. A pass reads <date>/RacesCandidates_Multiparish.htm and
# <date>/Votes_Multiparish.htm, then VotesRaceByParish/Votes_<race>.htm and VotesEarly/Votes_<race>.htm
# for each race whose OfficeLevel is in office_levels (140 U.S. Senator, 145 U.S. Representative,
# 160 PSC, 165 BESE, 205 State Representative, 998 Constitutional Amendment). Each election date is
# its own source (the 12/12/2026 runoff would be another entry). parishes: code -> name, copied from
# the parishList in the site's JavaScript bundle (/bundles/graphicalresults) on 2026-11-24; no data
# blob carries parish names. min_interval_s applies per file; request_gap_s between requests.

[la-2026-general]
state = "LA"
base_url = "https://voterportal.sos.la.gov/ElectionResults/ElectionResults/Data?blob="
election_date = "20261103"
office_levels = ["140", "145", "160", "165", "205", "998"]
min_interval_s = 120
request_gap_s = 10

